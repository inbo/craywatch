---
layout: base
description: Template for a leaflet map with deelbekkens
---

<div id="basins-map-status" class="basins-map-status"></div>
<div id="basins-map-status-live" class="basins-map-visually-hidden" aria-live="polite" aria-atomic="true"></div>
<div id="map" style="height: 600px;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  #map {
    height: 600px;
    width: 100%;
  }
  .basins-map-control {
    background: #fff;
    border: 1px solid #d9d9d9;
    border-radius: 0.5rem;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    max-width: 280px;
    padding: 0.75rem 1rem;
  }
  .basins-map-control-title {
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .basins-map-options label {
    cursor: pointer;
    display: block;
    font-weight: 400;
    margin-bottom: 0.35rem;
  }
  .basins-map-options input {
    margin-right: 0.4rem;
  }
  .basins-map-species-list {
    columns: 1;
    max-height: 14rem;
    overflow-y: auto;
  }
  .basins-map-status {
    color: #555;
    margin-bottom: 0.75rem;
    min-height: 1.5rem;
  }
  .basins-map-status:empty {
    display: none;
  }
  .basins-map-status.is-error {
    color: #b00020;
  }
  .basins-map-visually-hidden {
    border: 0;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    height: 1px;
    margin: -1px;
    overflow: hidden;
    padding: 0;
    position: absolute;
    width: 1px;
    white-space: nowrap;
  }
  .legend {
    background: white;
    line-height: 1.4;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    min-width: 210px;
  }
  .legend-subtitle {
    border-top: 1px solid #eee;
    font-weight: 700;
    margin-top: 0.5rem;
    padding-top: 0.5rem;
  }
  .legend-subtitle:first-child {
    border-top: 0;
    margin-top: 0;
    padding-top: 0;
  }
  .legend-item {
    align-items: center;
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.35rem;
  }
  .legend-swatch {
    border: 1px solid transparent;
    box-sizing: border-box;
    display: inline-block;
    flex: 0 0 auto;
    height: 16px;
    width: 18px;
  }
  .legend-swatch.circle {
    border-radius: 50%;
    height: 12px;
    width: 12px;
  }
  .leaflet-right .basins-map-control {
    margin-top: 12px;
  }
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const map = L.map('map', {
    center: [51.0, 4.15],
    zoom: 8
  });

  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  });

  const satellite = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap FR'
  });

  const positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  });

  positron.addTo(map);
  L.control.layers(
    {
      'OpenStreetMap': osm,
      'Satellite': satellite,
      'CartoDB Positron': positron
    },
    {},
    { collapsed: false, position: 'topleft' }
  ).addTo(map);

  map.createPane('basinPane');
  map.getPane('basinPane').style.zIndex = 410;
  map.createPane('pointPane');
  map.getPane('pointPane').style.zIndex = 420;

  const DATA_ROOT = '/data/analysis/output/maps/deelbekken/geojson_per_soort';
  const DEFAULT_LEGEND_STYLES = {
    presentBasin: { color: '#fb6a4a', fillColor: '#fb6a4a', fillOpacity: 0.6, weight: 2 },
    missingBasin: { color: '#999999', fillColor: 'transparent', fillOpacity: 0, weight: 1 },
    openObservation: { color: '#cb181d', fillColor: '#cb181d', weight: 1 },
    closedObservation: { color: 'orange', fillColor: 'orange', weight: 1 }
  };
  const CLEARED_STATUS_MESSAGE = '';

  const statusElement = document.getElementById('basins-map-status');
  const liveStatusElement = document.getElementById('basins-map-status-live');

  let speciesIndex = [];
  let selectedSpeciesSlug = null;
  let activeLayerGroup = L.featureGroup().addTo(map);
  let lastBounds = null;
  let legendStyles = DEFAULT_LEGEND_STYLES;

  const speciesControl = L.control({ position: 'topright' });
  speciesControl.onAdd = function() {
    const div = L.DomUtil.create('div', 'basins-map-control');
    div.innerHTML = [
      '<div class="basins-map-control-title">Soort</div>',
      '<div id="species-selector" class="basins-map-options basins-map-species-list"></div>'
    ].join('');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  speciesControl.addTo(map);

  const speciesSelector = document.getElementById('species-selector');

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  legend.addTo(map);

  function setStatus(message, isError) {
    const nextMessage = message || CLEARED_STATUS_MESSAGE;
    statusElement.textContent = nextMessage;
    liveStatusElement.textContent = nextMessage ? 'Kaartstatus: ' + nextMessage : CLEARED_STATUS_MESSAGE;
    statusElement.classList.toggle('is-error', Boolean(isError));
  }

  function toNumber(value, fallback) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function normalizeSpeciesIndex(indexData) {
    if (Array.isArray(indexData)) {
      return indexData;
    }

    if (!indexData || typeof indexData !== 'object') {
      return [];
    }

    return Object.keys(indexData).sort((left, right) => Number(left) - Number(right)).flatMap((key) => {
      const group = indexData[key];
      return Array.isArray(group) ? group : [];
    });
  }

  function getPolygonStyle(feature) {
    const properties = feature.properties || {};
    return {
      pane: 'basinPane',
      color: properties.color || '#666',
      weight: toNumber(properties.weight, 1),
      opacity: 1,
      fill: Boolean(properties.fillColor && toNumber(properties.fillOpacity, 0) > 0),
      fillColor: properties.fillColor || 'transparent',
      fillOpacity: toNumber(properties.fillOpacity, 0),
      interactive: true
    };
  }

  function getPointLayer(feature, latlng) {
    const properties = feature.properties || {};
    const strokeColor = properties.color || properties.point_color || '#000';
    return L.circleMarker(latlng, {
      pane: 'pointPane',
      color: strokeColor,
      weight: toNumber(properties.weight, 1),
      radius: 4,
      fill: true,
      fillColor: properties.point_color || properties.color || '#000',
      fillOpacity: 1,
      opacity: 1
    });
  }

  function onEachFeature(feature, layer) {
    const popupText = feature && feature.properties ? feature.properties.popup_text : null;
    if (popupText) {
      layer.bindPopup(popupText);
    }
  }

  function readLegendStyle(feature, fallback) {
    const properties = feature && feature.properties ? feature.properties : {};
    return {
      color: properties.color || fallback.color,
      fillColor: properties.fillColor || fallback.fillColor,
      fillOpacity: properties.fillOpacity !== undefined ? toNumber(properties.fillOpacity, fallback.fillOpacity) : fallback.fillOpacity,
      weight: properties.weight !== undefined ? toNumber(properties.weight, fallback.weight) : fallback.weight
    };
  }

  function updateLegendStyles(basinFeatures, pointFeatures) {
    const activeBasin = basinFeatures.find((feature) => feature.properties && feature.properties.active === true);
    const inactiveBasin = basinFeatures.find((feature) => feature.properties && feature.properties.active === false);
    const openObservation = pointFeatures.find((feature) => feature.properties && feature.properties.point_type === 'VHAG (Open)');
    const closedObservation = pointFeatures.find((feature) => feature.properties && feature.properties.point_type === 'WVLC/Niet gekoppeld');

    legendStyles = {
      presentBasin: readLegendStyle(activeBasin, DEFAULT_LEGEND_STYLES.presentBasin),
      missingBasin: readLegendStyle(inactiveBasin, DEFAULT_LEGEND_STYLES.missingBasin),
      openObservation: readLegendStyle(openObservation, DEFAULT_LEGEND_STYLES.openObservation),
      closedObservation: readLegendStyle(closedObservation, DEFAULT_LEGEND_STYLES.closedObservation)
    };
  }

  function renderLegend() {
    const container = legend.getContainer();
    const basinItems = [
      {
        label: 'Aanwezig (open systeem)',
        style: legendStyles.presentBasin
      },
      {
        label: 'Deelbekken (niet in open systeem)',
        style: legendStyles.missingBasin
      }
    ].map((item) => {
      const style = [
        'border-color:' + item.style.color,
        'border-width:' + item.style.weight + 'px',
        'background:' + item.style.fillColor,
        'opacity:1'
      ];

      if (item.style.fillOpacity === 0 || item.style.fillColor === 'transparent') {
        style.push('background:transparent');
      } else {
        style.push('background-color:' + item.style.fillColor);
        style.push('background-image:linear-gradient(rgba(255,255,255,' + (1 - item.style.fillOpacity) + '), rgba(255,255,255,' + (1 - item.style.fillOpacity) + '))');
      }

      return '<div class="legend-item"><span class="legend-swatch" style="' + style.join(';') + '"></span><span>' + item.label + '</span></div>';
    }).join('');

    const observationItems = [
      {
        label: 'Open systeem (VHAG)',
        style: legendStyles.openObservation
      },
      {
        label: 'Gesloten/niet gekoppeld',
        style: legendStyles.closedObservation
      }
    ].map((item) => {
      const style = [
        'border-color:' + item.style.color,
        'border-width:' + item.style.weight + 'px',
        'background:' + item.style.fillColor,
        'opacity:1'
      ].join(';');
      return '<div class="legend-item"><span class="legend-swatch circle" style="' + style + '"></span><span>' + item.label + '</span></div>';
    }).join('');

    container.innerHTML = [
      '<div class="legend-subtitle">Deelbekken</div>',
      basinItems,
      '<div class="legend-subtitle">Type waarneming</div>',
      observationItems
    ].join('');
  }

  function renderSpeciesSelector() {
    speciesSelector.innerHTML = speciesIndex.map((species) => {
      const checked = species.slug === selectedSpeciesSlug ? 'checked' : '';
      return [
        '<label>',
        '<input type="radio" name="species_selector" value="', species.slug, '" ', checked, '>',
        species.species,
        '</label>'
      ].join('');
    }).join('');

    speciesSelector.querySelectorAll('input[name="species_selector"]').forEach((input) => {
      input.addEventListener('change', function(event) {
        selectedSpeciesSlug = event.target.value;
        loadCurrentLayer();
      });
    });
  }

  function replaceActiveLayer(layers) {
    map.removeLayer(activeLayerGroup);
    activeLayerGroup = L.featureGroup(layers).addTo(map);
    if (activeLayerGroup.getLayers().length > 0) {
      const bounds = activeLayerGroup.getBounds();
      if (bounds.isValid()) {
        lastBounds = bounds;
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    } else if (lastBounds) {
      map.fitBounds(lastBounds, { padding: [20, 20] });
    }
  }

  async function loadCurrentLayer() {
    const species = speciesIndex.find((entry) => entry.slug === selectedSpeciesSlug);
    if (!species) {
      return;
    }

    setStatus(CLEARED_STATUS_MESSAGE, false);

    try {
      const response = await fetch(DATA_ROOT + '/' + species.file);
      if (!response.ok) {
        throw new Error('Bestand niet gevonden: ' + species.file);
      }

      const geojson = await response.json();
      const basinFeatures = (geojson.features || []).filter((feature) => feature.properties && feature.properties.feature_type === 'deelbekken');
      const pointFeatures = (geojson.features || []).filter((feature) => feature.properties && feature.properties.feature_type === 'observation');

      updateLegendStyles(basinFeatures, pointFeatures);

      const basinLayer = L.geoJSON({ type: 'FeatureCollection', features: basinFeatures }, {
        pane: 'basinPane',
        style: getPolygonStyle,
        onEachFeature: onEachFeature
      });

      const pointLayer = L.geoJSON({ type: 'FeatureCollection', features: pointFeatures }, {
        pointToLayer: getPointLayer,
        onEachFeature: onEachFeature
      });

      replaceActiveLayer([basinLayer, pointLayer]);
      renderLegend();
      setStatus(CLEARED_STATUS_MESSAGE, false);
    } catch (error) {
      replaceActiveLayer([]);
      legendStyles = DEFAULT_LEGEND_STYLES;
      renderLegend();
      setStatus('Kon de kaartlaag niet laden: ' + error.message, true);
      console.error(error);
    }
  }

  async function initializeBasinsMap() {
    try {
      const response = await fetch(DATA_ROOT + '/species_index.json');
      if (!response.ok) {
        throw new Error('Indexbestand niet gevonden');
      }

      speciesIndex = normalizeSpeciesIndex(await response.json());
      selectedSpeciesSlug = speciesIndex.length > 0 ? speciesIndex[0].slug : null;
      renderSpeciesSelector();
      renderLegend();
      await loadCurrentLayer();
    } catch (error) {
      renderLegend();
      setStatus('Kon de soortenindex niet laden: ' + error.message, true);
      console.error(error);
    }
  }

  initializeBasinsMap();
</script>

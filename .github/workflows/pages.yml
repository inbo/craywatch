name: Build and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, without cancelling a run in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Add CARTO basemaps API key to site config
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          # Separate config file, so the key is never committed to the repository
          ruby -ryaml -e 'File.write("_config_secrets.yml", {"carto_api_key" => ENV["CARTO_API_KEY"].to_s}.to_yaml)'

      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config_secrets.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
